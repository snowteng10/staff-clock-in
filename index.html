<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>打卡系統</h2>

    <!-- 姓名輸入框 -->
    <div class="form-group">
        <label for="nameInput">姓名</label>
        <input type="text" id="nameInput" placeholder="請輸入姓名">
    </div>

    <!-- 組別下拉選單 (C T, X光, sono) -->
    <div class="form-group">
        <label for="unitSelect">組別</label>
        <select id="unitSelect">
            <option value="" disabled selected>請選擇組別</option>
            <option value="C T">C T</option>
            <option value="X光">X光</option>
            <option value="sono">sono</option>
        </select>
    </div>

    <!-- 備註說明（保留您原本可能有的欄位，若無可自行保留或略過） -->
    <div class="form-group">
        <label for="remarkInput">備註說明 (選填)</label>
        <input type="text" id="remarkInput" placeholder="備註說明">
    </div>

    <!-- 出發 / 回程按鈕 -->
    <div class="btn-container">
        <button onclick="sendData('出發')" style="background-color: #007bff; color: white; border: none; cursor: pointer;">出發</button>
        <button onclick="sendData('回程')" style="background-color: #28a745; color: white; border: none; cursor: pointer;">回程</button>
    </div>

    <div id="statusMessage"></div>

    <script>
        // ★ 請務必將此處替換為您原本正在使用的 Google Apps Script 部署網址
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2tv8HtGK2sfBjdbv8yLXGtH_Ruv7FPMEBZ977Qbx1ln2V2VNiyPcyt5ZESiig4tTlcw/exec';

        // 1. 網頁載入時：自動從瀏覽器記憶體 (localStorage) 帶入上次填寫的姓名與組別
        window.onload = function() {
            var savedName = localStorage.getItem('saved_name');
            var savedUnit = localStorage.getItem('saved_unit');
            
            if (savedName) {
                document.getElementById('nameInput').value = savedName;
            }
            if (savedUnit) {
                document.getElementById('unitSelect').value = savedUnit;
            }
        };

        // 2. 點擊按鈕送出資料
        function sendData(type) {
            var name = document.getElementById('nameInput').value.trim();
            var unit = document.getElementById('unitSelect').value;
            var remark = document.getElementById('remarkInput').value.trim();
            var msgDiv = document.getElementById('statusMessage');
            
            if (!name) {
                alert('請填寫姓名！');
                return;
            }
            if (!unit) {
                alert('請選擇組別！');
                return;
            }

            // 將姓名與組別存入瀏覽器記憶體，下次關閉重開也會自動鎖定
            localStorage.setItem('saved_name', name);
            localStorage.setItem('saved_unit', unit);

            var payload = {
                type: type,
                name: name,
                unit: unit,
                remark: remark
            };

            msgDiv.style.color = 'black';
            msgDiv.innerText = '正在送出 ' + type + ' 記錄...';

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    msgDiv.style.color = 'green';
                    msgDiv.innerText = type + ' 打卡成功！';
                    document.getElementById('remarkInput').value = ''; // 清空備註
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = '打卡失敗：' + (data.message || '未知錯誤');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                msgDiv.style.color = 'red';
                msgDiv.innerText = '連線錯誤，請稍後再試';
            });
        }
    </script>
</body>
</html>
