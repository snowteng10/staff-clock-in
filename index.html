<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外勤打卡系統</title>
    <!-- 引入 Bootstrap 5 樣式讓畫面好看又響應式 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 40px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container" style="max-width: 500px;">
        <div class="card p-4 bg-white">
            <h3 class="text-center mb-4">🏥 外勤打卡系統</h3>
            
            <!-- 姓名輸入框 -->
            <div class="mb-3">
                <label for="nameInput" class="form-label">**姓名**</label>
                <input type="text" id="nameInput" class="form-control" placeholder="請輸入您的姓名">
            </div>

            <!-- 組別下拉選單 (C T / X光 / sono) -->
            <div class="mb-3">
                <label for="unitSelect" class="form-label">**組別**</label>
                <select id="unitSelect" class="form-select">
                    <option value="" disabled selected>請選擇組別</option>
                    <option value="C T">C T</option>
                    <option value="X光">X光</option>
                    <option value="sono">sono</option>
                </select>
            </div>

            <!-- 備註說明（選填） -->
            <div class="mb-4">
                <label for="remarkInput" class="form-label">備註說明 (選填)</label>
                <input type="text" id="remarkInput" class="form-control" placeholder="例如：某某地點或事項">
            </div>

            <!-- 打卡按鈕區 -->
            <div class="d-grid gap-2 d-md-flex justify-content-md-between">
                <button onclick="sendData('出發')" class="btn btn-primary btn-lg flex-fill">🚗 出發打卡</button>
                <button onclick="sendData('回程')" class="btn btn-success btn-lg flex-fill">🏁 回程打卡</button>
            </div>

            <!-- 提示訊息 -->
            <div id="statusMessage" class="mt-3 text-center text-muted"></div>
        </div>
    </div>

    <script>
        // ★ 請在此填入您的 Google Apps Script 部署網址 (WebApp URL)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2tv8HtGK2sfBjdbv8yLXGtH_Ruv7FPMEBZ977Qbx1ln2V2VNiyPcyt5ZESiig4tTlcw/exec';

        // 1. 當網頁載入時，自動從瀏覽器記憶體 (localStorage) 帶入上次儲存的姓名與組別
        window.onload = function() {
            var savedName = localStorage.getItem('saved_name');
            var savedUnit = localStorage.getItem('saved_unit');
            
            if (savedName) {
                document.getElementById('nameInput').value = savedName;
            }
            if (savedUnit) {
                document.getElementById('unitSelect').value = savedUnit;
            }
        };

        // 2. 點擊出發或回程時觸發的函數
        function sendData(type) {
            var name = document.getElementById('nameInput').value.trim();
            var unit = document.getElementById('unitSelect').value;
            var remark = document.getElementById('remarkInput').value.trim();
            var msgDiv = document.getElementById('statusMessage');
            
            // 檢查是否填寫
            if (!name) {
                alert('請先填寫姓名！');
                document.getElementById('nameInput').focus();
                return;
            }
            if (!unit) {
                alert('請選擇組別！');
                document.getElementById('unitSelect').focus();
                return;
            }

            // 將姓名與組別存入 localStorage，下次關閉網頁重開也會自動鎖定記憶
            localStorage.setItem('saved_name', name);
            localStorage.setItem('saved_unit', unit);

            var payload = {
                type: type,
                name: name,
                unit: unit,
                remark: remark
            };

            msgDiv.innerHTML = `<span class="text-primary">正在送出 ${type} 記錄...</span>`;

            // 發送到 Google Apps Script
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    msgDiv.innerHTML = `<span class="text-success fw-bold">✅ ${type} 打卡成功！</span>`;
                    // 清空備註欄位
                    document.getElementById('remarkInput').value = '';
                } else {
                    msgDiv.innerHTML = `<span class="text-danger">❌ 打卡失敗：${data.message || '未知錯誤'}</span>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                msgDiv.innerHTML = `<span class="text-danger">❌ 連線錯誤，請檢查網路或指令碼網址</span>`;
            });
        }
    </script>
</body>
</html>
