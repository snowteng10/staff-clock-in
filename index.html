<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出發與返回智慧打卡系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-route text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-tight">出發與返回打卡</h1>
                    <p class="text-xs text-slate-500">彈性多筆記錄與相鄰間隔計算</p>
                </div>
            </div>
            <div>
                <button id="open-config-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-2 rounded-xl transition flex items-center">
                    <i class="fa-solid fa-user-gear mr-1.5 text-indigo-600"></i> 設定身分
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-8 w-full flex-grow flex flex-col gap-6">
        
        <!-- 身分與時鐘卡片 -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 text-center flex flex-col gap-3">
            <div id="user-profile-badge" class="inline-block bg-indigo-50 text-indigo-700 font-semibold text-sm px-4 py-1 rounded-full border border-indigo-100 mx-auto">
                尚未設定身分
            </div>
            <div>
                <div id="live-clock" class="text-4xl font-bold text-indigo-600 font-mono tracking-wider">00:00:00</div>
                <div id="live-date" class="text-sm text-slate-400 mt-1">YYYY-MM-DD</div>
            </div>
        </div>

        <!-- 「出發」與「返回」雙核心按鈕區 -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col gap-4">
            <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">立即打卡動作</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <button id="btn-depart" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold p-6 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 transition transform active:scale-95 group">
                    <div class="bg-white/20 p-3 rounded-xl group-hover:scale-110 transition">
                        <i class="fa-solid fa-plane-departure text-2xl"></i>
                    </div>
                    <span class="text-xl tracking-wide">出發</span>
                    <span class="text-xs font-normal opacity-85">點擊記錄出發時間</span>
                </button>

                <button id="btn-return" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold p-6 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 transition transform active:scale-95 group">
                    <div class="bg-white/20 p-3 rounded-xl group-hover:scale-110 transition">
                        <i class="fa-solid fa-plane-arrival text-2xl"></i>
                    </div>
                    <span class="text-xl tracking-wide">返回</span>
                    <span class="text-xs font-normal opacity-85">點擊記錄返回時間</span>
                </button>
            </div>
        </div>

        <!-- 記錄與間隔時間計算顯示區 -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col gap-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h2 class="text-sm font-bold text-slate-800 flex items-center">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-500 mr-2"></i> 今日打卡時序與相鄰間隔
                </h2>
                <button id="clear-records-btn" class="text-xs text-red-600 font-semibold bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition">
                    <i class="fa-solid fa-trash-can mr-1"></i> 清空今日記錄
                </button>
            </div>
            
            <div id="timeline-container" class="flex flex-col gap-2.5 text-sm">
                <p class="text-slate-400 text-center py-6">今日尚未有任何出發或返回紀錄</p>
            </div>
        </div>
    </main>

    <!-- 身分設定 Modal -->
    <div id="config-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl flex flex-col gap-4">
            <h3 class="font-bold text-lg text-slate-900">設定您的身分</h3>
            <p class="text-xs text-slate-500">請輸入您的姓名與所屬組別，系統將記錄於打卡清單中。</p>
            
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">姓名</label>
                <input type="text" id="input-name" placeholder="例如：王小明" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">組別 / 單位</label>
                <input type="text" id="input-group" placeholder="例如：外勤公關組" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex gap-2 mt-2">
                <button id="config-save-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl text-sm font-semibold transition">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 一般通知對話框 Modal -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl flex flex-col gap-3">
            <h3 id="modal-title" class="font-bold text-slate-900">提示</h3>
            <p id="modal-message" class="text-sm text-slate-600"></p>
            <div class="flex justify-end mt-2">
                <button id="modal-close-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">確定</button>
            </div>
        </div>
    </div>

    <script>
        const liveClockEl = document.getElementById('live-clock');
        const liveDateEl = document.getElementById('live-date');
        const userProfileBadge = document.getElementById('user-profile-badge');
        const timelineContainer = document.getElementById('timeline-container');

        const btnDepart = document.getElementById('btn-depart');
        const btnReturn = document.getElementById('btn-return');
        const clearRecordsBtn = document.getElementById('clear-records-btn');

        const openConfigBtn = document.getElementById('open-config-btn');
        const configModal = document.getElementById('config-modal');
        const inputName = document.getElementById('input-name');
        const inputGroup = document.getElementById('input-group');
        const configSaveBtn = document.getElementById('config-save-btn');

        const customModal = document.getElementById('custom-modal');
        const modalMessage = document.getElementById('modal-message');
        const modalTitle = document.getElementById('modal-title');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        let userName = localStorage.getItem('depart_return_name') || '';
        let userGroup = localStorage.getItem('depart_return_group') || '';

        let todayKey = new Date().toISOString().slice(0, 10);
        // 儲存格式: { "YYYY-MM-DD": [ {type: 'depart'/'return', time: 'HH:MM:SS'}, ... ] }
        let allRecords = JSON.parse(localStorage.getItem('depart_return_records') || '{}');

        // Web Audio API 提示音
        let audioCtx = null;
        document.addEventListener('click', () => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }, { once: true });

        function playBeep() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } catch (e) {}
        }

        function initApp() {
            updateClock();
            setInterval(updateClock, 1000);
            renderUI();

            if (!userName || !userGroup) {
                configModal.classList.remove('hidden');
            }
        }

        function updateClock() {
            const now = new Date();
            liveClockEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            liveDateEl.textContent = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            
            const currentDateStr = now.toISOString().slice(0, 10);
            if (currentDateStr !== todayKey) {
                todayKey = currentDateStr;
                renderUI();
            }
        }

        function renderUI() {
            if (userName && userGroup) {
                userProfileBadge.textContent = `組別：${userGroup} | 姓名：${userName}`;
            } else {
                userProfileBadge.textContent = '尚未設定身分';
            }

            const todayList = allRecords[todayKey] || [];
            if (todayList.length === 0) {
                timelineContainer.innerHTML = '<p class="text-slate-400 text-center py-6">今日尚未有任何出發或返回紀錄</p>';
                return;
            }

            let html = '';
            let lastTimestamp = null;

            todayList.forEach((item, index) => {
                let intervalText = '';
                const currentTimestamp = new Date(`${todayKey}T${item.time}`).getTime();

                if (lastTimestamp !== null) {
                    const diffMs = currentTimestamp - lastTimestamp;
                    if (diffMs > 0) {
                        const totalMins = Math.floor(diffMs / 60000);
                        const hrs = Math.floor(totalMins / 60);
                        const mins = totalMins % 60;
                        intervalText = `<span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg ml-2 font-medium">距前次間隔: ${hrs > 0 ? hrs + '小時 ' : ''}${mins}分鐘</span>`;
                    }
                }
                lastTimestamp = currentTimestamp;

                const isDepart = item.type === 'depart';
                const badgeColor = isDepart ? 'bg-blue-500' : 'bg-emerald-500';
                const iconClass = isDepart ? 'fa-plane-departure text-blue-600' : 'fa-plane-arrival text-emerald-600';
                const labelName = isDepart ? '出發' : '返回';

                html += `
                    <div class="flex items-center justify-between bg-slate-50 p-3.5 rounded-xl border border-slate-200 transition hover:bg-slate-100/80">
                        <div class="flex items-center space-x-3 overflow-hidden">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center bg-white shadow-sm border border-slate-200 flex-shrink-0">
                                <i class="fa-solid ${iconClass}"></i>
                            </div>
                            <div class="truncate">
                                <div class="flex items-center flex-wrap gap-1">
                                    <span class="font-bold text-slate-800">${index + 1}. ${labelName}</span>
                                    ${intervalText}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3 flex-shrink-0">
                            <span class="font-mono font-bold text-indigo-600 text-base">${item.time}</span>
                            <button onclick="deleteRecord(${index})" class="text-slate-400 hover:text-red-500 p-1 transition" title="刪除此筆記錄">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            timelineContainer.innerHTML = html;
        }

        function handlePunch(type, name) {
            if (!userName || !userGroup) {
                configModal.classList.remove('hidden');
                return;
            }

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            
            if (!allRecords[todayKey]) allRecords[todayKey] = [];
            allRecords[todayKey].push({ type: type, time: timeStr });

            playBeep();
            localStorage.setItem('depart_return_records', JSON.stringify(allRecords));
            renderUI();
            showModal('打卡成功', `已成功記錄【${name}】，時間：${timeStr}`);
        }

        window.deleteRecord = function(index) {
            if (allRecords[todayKey]) {
                allRecords[todayKey].splice(index, 1);
                localStorage.setItem('depart_return_records', JSON.stringify(allRecords));
                renderUI();
            }
        };

        btnDepart.onclick = () => handlePunch('depart', '出發');
        btnReturn.onclick = () => handlePunch('return', '返回');

        clearRecordsBtn.onclick = () => {
            if (allRecords[todayKey] && allRecords[todayKey].length > 0) {
                if (confirm('確定要清空今日的所有打卡記錄嗎？')) {
                    delete allRecords[todayKey];
                    localStorage.setItem('depart_return_records', JSON.stringify(allRecords));
                    renderUI();
                }
            } else {
                showModal('提示', '今日目前沒有任何打卡記錄可供清空。');
            }
        };

        openConfigBtn.onclick = () => {
            inputName.value = userName;
            inputGroup.value = userGroup;
            configModal.classList.remove('hidden');
        };

        configSaveBtn.onclick = () => {
            if (!inputName.value.trim() || !inputGroup.value.trim()) {
                showModal('提示', '請填寫完整的姓名與組別！');
                return;
            }
            userName = inputName.value.trim();
            userGroup = inputGroup.value.trim();

            localStorage.setItem('depart_return_name', userName);
            localStorage.setItem('depart_return_group', userGroup);

            configModal.classList.add('hidden');
            renderUI();
            showModal('成功', '身分資料已儲存！');
        };

        function showModal(title, msg) {
            modalTitle.textContent = title;
            modalMessage.textContent = msg;
            customModal.classList.remove('hidden');
        }
        modalCloseBtn.onclick = () => customModal.classList.add('hidden');

        window.onload = initApp;
    </script>
</body>
</html>
